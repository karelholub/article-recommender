<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or 'Article Recommender' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        .app-shell {
            min-height: 100vh;
        }
        .app-sidebar {
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;
            border-right: 1px solid #1e293b;
        }
        .app-sidebar .nav-link {
            color: #cbd5e1;
            border-radius: 0.375rem;
            margin-bottom: 0.25rem;
        }
        .app-sidebar .nav-link.active,
        .app-sidebar .nav-link:hover {
            color: #fff;
            background: #1e293b;
        }
        .app-main {
            background: #f8fafc;
        }
        @media (max-width: 991px) {
            .app-sidebar {
                min-height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid app-shell">
        <div class="row">
            <aside class="col-lg-2 p-3 app-sidebar">
                <h5 class="mb-3"><i class="fas fa-brain me-2"></i>Recommender</h5>
                <nav class="nav flex-column">
                    <a class="nav-link {% if active_page == 'recommendations' %}active{% endif %}" href="{{ url_for('recommendations_page') }}">
                        <i class="fas fa-newspaper me-2"></i>Recommendations
                    </a>
                    <a class="nav-link {% if active_page == 'reporting' %}active{% endif %}" href="{{ url_for('reporting_page') }}">
                        <i class="fas fa-chart-line me-2"></i>Reporting
                    </a>
                    <a class="nav-link {% if active_page == 'operations' %}active{% endif %}" href="{{ url_for('operations_page') }}">
                        <i class="fas fa-sliders-h me-2"></i>Operations
                    </a>
                    <a class="nav-link {% if active_page == 'cdp' %}active{% endif %}" href="{{ url_for('cdp_page') }}">
                        <i class="fas fa-id-card me-2"></i>CDP
                    </a>
                    <a class="nav-link {% if active_page == 'runs' %}active{% endif %}" href="{{ url_for('runs_page') }}">
                        <i class="fas fa-history me-2"></i>Run Explorer
                    </a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4 app-main">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
