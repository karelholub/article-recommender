{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="mb-0">Recommendation Run Explorer</h3>
        <button id="refresh-run-explorer" class="btn btn-sm btn-outline-secondary">Refresh</button>
    </div>
    <div class="card-body">
        <div class="row g-2 mb-2">
            <div class="col-md-3">
                <label class="form-label small mb-1" for="run-limit">Recent runs</label>
                <input id="run-limit" class="form-control form-control-sm" type="number" min="5" max="100" value="20">
            </div>
        </div>
        <div class="row g-3">
            <div class="col-lg-4">
                <div id="run-list" class="small text-muted">Loading runs...</div>
            </div>
            <div class="col-lg-8">
                <div id="run-detail-summary" class="small text-muted mb-2">Select a run.</div>
                <pre id="run-detail-request" class="small bg-light p-2 rounded mb-2">-</pre>
                <div class="table-responsive">
                    <table class="table table-sm mb-0">
                        <thead><tr><th>Rank</th><th>Article</th><th>Score</th><th>Reasoning</th></tr></thead>
                        <tbody id="run-detail-items"><tr><td colspan="4" class="text-muted">No run selected.</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
