services:
  postgres:
    image: postgres:16
    container_name: article-recommender-postgres-prod
    environment:
      POSTGRES_USER: recommender
      POSTGRES_PASSWORD: recommender
      POSTGRES_DB: article_recommender
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommender -d article_recommender"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: article-recommender-migrate-prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECOMMENDER_DB_BACKEND: postgres
      DATABASE_URL: postgresql://recommender:recommender@postgres:5432/article_recommender
      RUN_MIGRATIONS: "false"
    command: ["python", "scripts/migrate_postgres.py"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: article-recommender-app-prod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      RECOMMENDER_DB_BACKEND: postgres
      DATABASE_URL: postgresql://recommender:recommender@postgres:5432/article_recommender
      RUN_MIGRATIONS: "false"
      CONNECTOR_SCHEDULER_ENABLED: "true"
      CONNECTOR_SCHEDULER_INTERVAL_SECONDS: "60"
      API_HOST: 0.0.0.0
      API_PORT: 5001
      API_DEBUG: "False"
    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:5001",
        "--workers",
        "1",
        "--threads",
        "4",
        "--timeout",
        "60",
        "app:app"
      ]
    ports:
      - "5001:5001"
    volumes:
      - app_embeddings_prod:/app/embeddings
      - app_profiles_prod:/app/profiles
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data_prod:
  app_embeddings_prod:
  app_profiles_prod:
